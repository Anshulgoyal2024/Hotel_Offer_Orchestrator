name: hotel-offer-orchestrator

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Temporal server + Web UI in a single container (SQLite persisted in a volume).
  # Perfect for local development and reviews. For production you would run a
  # real Temporal cluster (or Temporal Cloud) backed by Postgres/Cassandra.
  # Pin a version if you want reproducible builds:  TEMPORAL_VERSION=1.10.1
  temporal-data-init:
    image: redis:7-alpine
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - temporal-data:/data
    restart: "no"

  temporal:
    image: temporalio/temporal:${TEMPORAL_VERSION:-latest}
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --ui-port
      - "8233"
      - --db-filename
      - /data/temporal.db
    ports:
      - "7233:7233" # gRPC (workers / clients)
      - "8233:8233" # Web UI  -> http://localhost:8233
    volumes:
      - temporal-data:/data
    depends_on:
      temporal-data-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # HTTP API + mock supplier endpoints. Starts Temporal workflows.
  api:
    build: .
    image: hotel-offer-orchestrator:local
    command: ["node", "dist/server.js"]
    ports:
      - "3000:3000"
    environment: &app-env
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offers
      # The mock suppliers are served by the API container itself.
      SUPPLIER_A_URL: http://api:3000/supplierA/hotels
      SUPPLIER_B_URL: http://api:3000/supplierB/hotels
      SUPPLIER_TIMEOUT_MS: "3000"
      CACHE_TTL_SECONDS: "60"
      DEGRADED_CACHE_TTL_SECONDS: "10"
      WORKFLOW_TIMEOUT_SECONDS: "30"
      MOCK_CHAOS_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  # Temporal worker: executes the workflow and the activities (supplier calls, Redis writes).
  # Scale horizontally with:  docker compose up --scale worker=3
  worker:
    build: .
    image: hotel-offer-orchestrator:local
    command: ["node", "dist/worker.js"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  temporal-data:
